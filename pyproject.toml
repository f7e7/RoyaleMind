[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "royalemind"
version = "0.1.0"
description = "Read-only Clash Royale analysis and offline simulation foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pillow>=10,<13", "pydantic>=2.7,<3"]

[project.scripts]
royalemind = "royale_mind.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8.0,<9", "ruff>=0.5,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/royale_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["royale_mind"]
strict = true
plugins = ["pydantic.mypy"]
